<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>Cadastro Fornecedor</title>
</head>
<body>
    
         <h1>Estoque-aqui</h1>
    <h2>Cadastro de fornecedores</h2>
     <div class="forms">
   <form action="/fornecedor" method="POST">
    <input type="hidden" name="usuario.idUser" value="<%= usuario.id %>">

    <label for="nome">Nome do Fornecedor:</label>
    <input type="text" name="nome" required>

    <label for="cnpj">CNPJ:</label>
    <input type="text" name="cnpj" required>

    <label for="telefone">Telefone:</label>
    <input type="text" name="telefone" required>

    <button type="submit">Salvar Fornecedor</button>
</form>
  <p><%=mensagem%></p>     
       
            <form action="deleteForn/<%=fornecedor.id%>?_method=delete>" method="get"><br>
                <% if(fornecedor){ 
                      <select name="forn id="">
            <% forEach.usuario.fornecedor(fornecedor =>{
                  <option value="<%= fornecedor.cnpj %>"><%= fornecedor.cnpj %></option><br>
        }) %>%
         <br> </select>
         <button type="submit" id="excluir">Excluir</button>
       
            </form> 
              <%  }else{ %>
                <select name="" id="" disabled="disabled">
                    <option value="">Nenhum usuario cadastrado</option>
                </select>
                <button disabled="disabled">Excluir</button>
            <%  } %>
               
            </form> 
        
    </div>
</body>
</html>
