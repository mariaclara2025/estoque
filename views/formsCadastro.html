<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="static/style.css">

    <title>Pagina de cadastro</title>
</head>
<body>
    <form action="/usuario" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nomeUser" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="emailUser" required><br><br>
        
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senhaUser" required><br><br>
        
        <input type="submit" value="Cadastrar"></form>
        <p><%= mensagem %></p>
</body>
</html>
