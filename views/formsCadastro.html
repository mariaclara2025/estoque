<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="static/style.css">

    <title>Pagina de cadastro</title>
</head>
<body>
        <h1>Estoque-aqui</h1>
    <h2>Cadastro</h2>
        <div class="forms">

    <form action="/usuario" method="post">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nomeUser" required><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="emailUser" required><br>
        

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senhaUser" required><br>
        
        <input type="submit" value="Cadastrar" class="entrar">
         <% if (typeof mensagem !== 'undefined' && mensagem) { %>
    <p><%= mensagem %></p>
<% } %>
       
        </div></form>
</body>
</html>
