<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>Página cadastro de produtos</title>
</head>
<body>
             <h1>Estoque-aqui</h1>
    <h2>Cadastro de fornecedores</h2>
 <div class="forms">
    <form action="/produtoCadastro" method="post">
     <input type="hidden" name="usuarioId" value="<$= usuario.id %>">   
  <label for="">Nome</label><br>
  <input type="text" name="nome" id=""><br>
  <label for="">Preço</label><br>
  <input type="number" name="preco" id=""><br>
  <label for="">Quantidade</label><br>
  <input type="number" name="quant id=""><br>
  <label for="">Data de validade</label><br>
  <input type="datetime" name="data_val" id=""><br>
  <input type="submit" value="Cadastrar" class="entrar"><br>
  <label>Fornecedor</label><br>
     <select name="fornProd" id="">
            <% usuario.fornecedor.forEach( fornecedor=>
            <option value="<%=fornecedor.id%>" ><%= fornecedor.cnpj -- fornecedor.nome %></option>
            )
        </select><br>
       <% if (typeof mensagemprod !== 'undefined' && mensagemprod) { %>
    <p><%= mensagemprod %></p>
<% } %>
   </div> </form>

   <h2>Editar produtos</h2>
   <div >
  <form action="/produto/<%= usuario.id %>?_method=PUT" class="forms" method="POST">
  <label for="produtoSelect">Qual produto deseja atualizar?</label>
  
  <% if (produtos) { %>
    <select name="produtoId" id="produtoSelect">
      <% produtos.forEach(produto => { %>
        <option value="<%= produto.id %>"><%= produto.nome %></option>
      <% }) %>
    </select>
    <br><br>

    <label for="infoSelect">Qual campo será atualizado:</label>
    <select name="info" id="info">
      <option value="nomeProd">Nome</option>
      <option value="precoProd">Preço</option>
      <option value="quantProd">Quantidade</option>
      <option value="valProd">Validade</option>
    </select>
    <br><br>

    <label for="infoNova">Novo valor:</label>
    <input type="text" name="infoNova" id="infoNova" required>
    <br><br>

    <button type="submit">Atualizar</button>
  <% } %>
</form>
  <% if (typeof mensagemPut !== 'undefined' && mensagemPut) { %>
    <p><%= mensagemPut %></p>
   </div>
</body>
</html>
