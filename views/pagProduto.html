<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>Página cadastro de produtos</title>
</head>
<body>
             <h1>Estoque-aqui</h1>
    <h2>Cadastro de fornecedores</h2>
 <div class="forms">
    <form action="/produtoCadastro" method="post">
     <input type="hidden" name="usuarioId" value="<$= usuario.id %>">   
  <label for="">Nome</label><br>
  <input type="text" name="nome" id=""><br>
  <label for="">Preço</label><br>
  <input type="number" name="preco" id=""><br>
  <label for="">Quantidade</label><br>
  <input type="number" name="quant id=""><br>
  <label for="">Data de validade</label><br>
  <input type="datetime" name="data_val" id=""><br>
  <input type="submit" value="Cadastrar" class="entrar"><br>
  <label>Fornecedor</label>
     <select name="fornProd" id="">
            <% usuario.fornecedor.forEach( fornecedor=>
            <option value="<%=fornecedor.id%>" ><%= fornecedor.cnpj -- fornecedor.nome %></option>
            )
        </select>
       <% if (typeof mensagem !== 'undefined' && mensagem) { %>
    <p><%= mensagem %></p>
<% } %>
   </div> </form>
   <h2>Editar produtos</h2>
   <form action="/produto/<$= usuario.id %>_method=put" method="post">
     <label for="">Qual produto deseja atualizar</label>
     <% if(produtos){ %>
           <% produtos.forEach(produto =>
             <option value="<%=produto.id%>" ><%= produto.nome %></option>
            )
        </select>
         <%  )%>
         <label for="">Qual campo sera atualizado:</label>
          <select name="info" id="">
         <option value="Nome">Nome</option>
         <option value="precoProd">Preço</option>
         <option value="quantProd">Quantidade</option>
         <option value="valprod">Validade</option>
      </select>
     <%}%>
     <input type="text" name="infoNova" id="">
   </form>
</body>
</html>
