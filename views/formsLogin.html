<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="static/style.css">
   
    <title>Página de Login</title>
</head>
<body>
    

   
    <h1>Estoque-aqui</h1>
    <h2>Login</h2>
    <div class="forms">
    <form action="/usuarioLogin" method="post">
        <label for="username">Usuario:</label><br>
        <input type="text" id="username" name="username" required><br>
        
        <label for="password">Senha:</label><br>
        <input type="password" id="password" name="senhaUser" required><br><br>

        <!-- criar rota para redefinir senha -->
        <input type="submit" value="Entrar" class="entrar">
        <p>Esqueceu a senha? <a href="/redSenha">Redefinir senha</a></p>
       <p>Não se cadastrou?  <a href="/pagCadastro">Cadastre-se</a></p>
      

      
        <p>><%= mensagem %></p>
       
         </div></form>
</body>     
</html>
